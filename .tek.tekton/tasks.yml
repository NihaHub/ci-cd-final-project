apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  params:
    - name: app-name
      type: string
      default: cicd-app
  steps:
    - name: remove-app
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/sh
        oc delete deployment $(params.app-name) --ignore-not-found=true
        oc delete service $(params.app-name) --ignore-not-found=true

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  steps:
    - name: run-tests
      image: python:3.10
      script: |
        #!/bin/sh
        pip install --upgrade pip
        pip install nose
        nosetests
