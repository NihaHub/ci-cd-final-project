
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: clean-workspace
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning temporary build artifacts"
        rm -rf "$(workspaces.source.path)/.pytest_cache"
        rm -rf "$(workspaces.source.path)/.coverage"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir flake8==4.0.1
        flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: unit-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -r requirements.txt
        nosetests -v
